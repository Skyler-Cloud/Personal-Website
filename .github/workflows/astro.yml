name: Bootstrap verified dependency lockfile
on:
  push:
    branches: [main]
    paths: [.github/workflows/astro.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify checkout and check for existing lock
        id: check
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          if test -f package-lock.json; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Recover exact lockfile from successful verification
        if: steps.check.outputs.needed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dependency-lockfile
          run-id: 46069452121
          github-token: ${{ github.token }}
          path: .
      - name: Commit only the verified lockfile
        if: steps.check.outputs.needed == 'true'
        run: |
          node -e 'const p=require("./package.json"), l=require("./package-lock.json"); for(const k of ["dependencies","devDependencies","engines"]){ const a=p[k], b=l.packages[""][k]; if(JSON.stringify(Object.entries(a).sort())!==JSON.stringify(Object.entries(b).sort())) throw Error("Lockfile manifest mismatch: "+k); }'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m "Pin dependencies from verified Astro build"
          git push origin HEAD:main
