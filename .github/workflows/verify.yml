name: Verify website
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Save first lockfile for reproducible builds
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile
          path: package-lock.json
          retention-days: 3
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:build
      - name: Verify hosting under a repository path
        env:
          BASE_PATH: /preview-test/
        run: |
          npm run build
          npm run check:build
